buildscript {
	repositories {
		gradlePluginPortal()
		flatDir {
			dirs 'libs'
		}
		dependencies {
			classpath name:'package-compileonly-sdk', version: '1.7.0'
			classpath "gradle.plugin.com.github.johnrengelman:shadow:7.1.1"
		}
	}
}

plugins {
	id 'java'
}

configure(allprojects){

	apply plugin: 'com.github.johnrengelman.shadow'
	apply plugin: "com.automationanywhere.command-codegen"

	ext {
		groupName = 'com.byIgorFP'
		authorName = 'IgorFP'
		vendorName = "IgorFP"
		testNgVersion = '6.14.3'
		loggerVersion = '2.20.0'
		jnaVersion = '5.3.1'
		version '1.0.0'
	}
	group "$groupName"

	sourceCompatibility = JavaVersion.VERSION_11

	compileJava.options.encoding = 'UTF-8'
	compileTestJava.options.encoding = 'UTF-8'

	repositories {
		mavenCentral()
		flatDir {
			dirs 'libs'
		}
	}

	packageJson{
		artifactName = project.name
		group = "$groupName"
		author = "IgorFP"
		generatePackageWithDateTime = true
	}

	classes.dependsOn commandCodeGen

	shadowJar {
		archiveBaseName = project.name
		classifier = null
		mergeServiceFiles('META-INF/spring.*')
		mergeServiceFiles('META-INF/services/java.sql.Driver')
		zip64 = true
		exclude 'META-INF/MANIFEST.MF'
		exclude 'META-INF/*.SF'
		exclude 'META-INF/*.DSA'
		exclude 'META-INF/*.RSA'
	}

	test {
		useTestNG() // Ensures Gradle uses TestNG for your tests
		
		reports {
			junitXml.required = true
			// Forces Gradle to include individual test case metadata in the XML report
			junitXml.outputPerTestCase = true 
		}
	}

	dependencies {
		annotationProcessor name: 'package-compileonly-sdk', version: '1.7.0'

		compileOnly name: 'package-compileonly-sdk', version: '1.7.0'
		compileOnly group: "net.java.dev.jna", name: "jna-platform", version: "$jnaVersion"

		implementation name: 'package-runtime-sdk', version: '1.0.0'

		testImplementation name: 'package-compileonly-sdk', version: '1.7.0'

		//Remove these dependencies if not needed
		implementation group: 'org.apache.activemq', name: 'activemq-all', version: '5.18.1'
		implementation group: 'org.apache.commons', name: 'commons-dbcp2', version: '2.9.0'
		implementation group: 'com.h2database', name: 'h2', version: '2.1.214'

		testImplementation name: 'package-compileonly-sdk', version: '1.7.0'
		testImplementation group: "org.testng", name:"testng", version: "$testNgVersion"
	}

}
